name: LiteLLM Stable Monitor

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-pr:
    runs-on: ubuntu-latest
    steps:

      # Step 1: Get latest stable tag
      - name: Get latest stable tag
        id: check
        run: |
          LATEST=$(curl -s https://api.github.com/repos/BerriAI/litellm/releases \
            | jq -r '[.[] | select(.draft==false and .prerelease==false) | select(.tag_name | test("rc|dev|beta|alpha") | not)] | first | .tag_name')
          echo "Latest stable tag: $LATEST"
          if [ -z "$LATEST" ]; then
            echo "No stable tag found, exiting"
            exit 1
          fi
          echo "tag=$LATEST" >> $GITHUB_OUTPUT

      # Step 2: Check if PR already exists for this version
      - name: Check existing PR
        id: existing
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          TAG=${{ steps.check.outputs.tag }}
          COUNT=$(gh pr list \
            --repo Raman-12321/litellm \
            --state open \
            --search "sync: BerriAI main ($TAG)" \
            --json title --jq 'length')
          echo "existing=$COUNT" >> $GITHUB_OUTPUT
          echo "Existing PRs found: $COUNT"

      # Step 3: Checkout repo
      - name: Checkout repo
        if: steps.existing.outputs.existing == '0'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      # Step 4: Fetch upstream main and create branch
      - name: Fetch upstream and create branch
        if: steps.existing.outputs.existing == '0'
        run: |
          TAG=${{ steps.check.outputs.tag }}
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git remote add upstream https://github.com/BerriAI/litellm.git
          git fetch upstream main
          git checkout -b sync/berryai-main-$TAG upstream/main
          git push origin sync/berryai-main-$TAG --force

      # Step 5: Create PR from that branch
      - name: Create PR
        if: steps.existing.outputs.existing == '0'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          TAG=${{ steps.check.outputs.tag }}
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Raman-12321/litellm/pulls \
            -d "{
              \"title\": \"sync: BerriAI main ($TAG)\",
              \"body\": \"## LiteLLM Upstream Sync\n\n**Version:** $TAG\n**Release notes:** https://github.com/BerriAI/litellm/releases/tag/$TAG\n\nAuto-generated by stable monitor. Review and merge manually.\",
              \"head\": \"sync/berryai-main-$TAG\",
              \"base\": \"main\"
            }")
          echo $RESPONSE | jq .
          PR_URL=$(echo $RESPONSE | jq -r '.html_url')
          if [ "$PR_URL" = "null" ]; then
            echo "Failed to create PR"
            exit 1
          fi
          echo "PR created: $PR_URL"
